name: Task per agente
description: Implementazione di un caso d'uso con un agente (Copilot o OpenCode)
title: "CP-XX UC_XXX_XX: "
labels: ["task-agente"]
body:
  - type: markdown
    attributes:
      value: |
        Compila tutti i campi. Nessun agente parte all'invio: il PM rilegge il task
        e poi aggiunge la label `fase:piano`. Guida: `docs/agentic-workflow.md`.
  - type: input
    id: jira
    attributes:
      label: Task Jira
      placeholder: CP-12
    validations:
      required: true
  - type: input
    id: uc
    attributes:
      label: Caso d'uso e requisiti
      placeholder: UC_TRIP_01 PubblicaViaggio — RF_TRIP_01, RF_TRIP_02
    validations:
      required: true
  - type: textarea
    id: specifica
    attributes:
      label: Specifica (file da leggere)
      description: Solo gli artefatti necessari, e solo le classi rilevanti del class diagram.
      placeholder: |
        - docs/rad/uc/UC_TRIP_01.md
        - docs/modelli/SD_CP_03_Pubblicare_viaggio.puml
        - docs/modelli/CD_CP_01_Entity.puml: Viaggio, Membro, Veicolo
        - docs/modelli/CD_CP_02_Boundary_Control.puml: PubblicaViaggioControl
    validations:
      required: true
  - type: textarea
    id: ambito
    attributes:
      label: Ambito (file, classi e metodi da toccare)
      description: Ricavato dal sequence diagram. Ogni file fuori ambito è un segnale da controllare.
      placeholder: |
        - backend/src/control/PubblicaViaggioControl.js: avviaPubblicazione(), pubblica(dati)
        - backend/src/model/Viaggio.js: costruttore Viaggio(dati, conducente, sede)
        - backend/src/routes/viaggi.js: endpoint di PubblicazioneViaggioBoundary
    validations:
      required: true
  - type: textarea
    id: verifica
    attributes:
      label: Verifica (test frame da coprire)
      placeholder: TF01-TF09 di docs/test/cp_UC_TRIP_01.md
    validations:
      required: true
  - type: dropdown
    id: agente
    attributes:
      label: Agente
      options:
        - OpenCode (pipeline con label)
        - Copilot coding agent (issue assegnata a Copilot)
        - In locale (Copilot o OpenCode nell'editor)
    validations:
      required: true
  - type: textarea
    id: procedura
    attributes:
      label: Procedura
      value: |
        Prima proponi un piano (file e metodi) e attendi l'approvazione.
        Poi implementa ed esegui lint e test.
