# Fase 2 – Implementazione. Parte quando lo sviluppatore assegnato, dopo aver
# letto e approvato il piano, aggiunge la label fase:implementazione.
# Quel gesto è il punto di approvazione del piano.
name: Agente implementatore
on:
  issues:
    types: [labeled]
concurrency:
  group: agente-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  implementa:
    if: github.event.label.name == 'fase:implementazione' && vars.OPENCODE_MODEL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      models: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          agent: implementatore
          use_github_token: true
          prompt: |
            Implementa il piano approvato nell'issue #${{ github.event.issue.number }}
            (l'ultimo piano commentato). Rispetta AGENTS.md.
            Tocca solo i file dell'ambito del piano. Esegui npm run lint e npm test
            nelle cartelle toccate.
            Nella risposta finale scrivi la descrizione della PR seguendo
            .github/pull_request_template.md, con "closes #${{ github.event.issue.number }}",
            i file modificati, l'esito di lint e test e i tentativi falliti.
            Se serve qualcosa fuori dal piano, fermati e scrivilo senza modificare file.
