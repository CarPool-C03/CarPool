# Workflow minimo di prova (nessun agente, nessun secret).
# Aggiungere la label «prova» a un'issue: se compare il commento «Ciao!»,
# eventi, condizione e permessi funzionano.
name: Saluto
on:
  issues:
    types: [labeled]
jobs:
  saluta:
    if: github.event.label.name == 'prova'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - run: gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Ciao! La pipeline risponde agli eventi."
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
