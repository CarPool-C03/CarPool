# Fase 3 – Test dai test frame. Parte quando lo sviluppatore aggiunge la label
# fase:test alla PR. Il tester lavora in una sessione nuova: non conosce la
# conversazione dell'implementatore e non legge il corpo dei metodi.
name: Agente tester
on:
  pull_request:
    types: [labeled]
concurrency:
  group: agente-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  test:
    if: >-
      github.event.label.name == 'fase:test' && vars.OPENCODE_MODEL != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      models: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          agent: tester
          use_github_token: true
          prompt: |
            Segui .opencode/agents/tester.md e AGENTS.md.
            Il caso d'uso e i test frame sono nell'issue collegata alla
            PR #${{ github.event.pull_request.number }} (riga "closes #N").
            Scrivi un test per frame, solo file di test, ed esegui npm test.
            Se un test fallisce non toccare il codice: nella risposta finale
            elenca frame falliti, esito atteso ed esito ottenuto.
