# Database PostgreSQL locali, uguali a quello della CI (.github/workflows/ci.yml).
# Avvio: docker compose up -d · Arresto: docker compose down
# Credenziali solo per i database locali usa-e-getta.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: carpool
      POSTGRES_DB: carpool_dev
    ports:
      - '5432:5432'
    volumes:
      - carpool_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carpool']
      interval: 5s
      timeout: 5s
      retries: 10

  # Database dei test: svuotato dai test stessi, nessun volume (i dati si perdono all'arresto).
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: carpool
      POSTGRES_DB: carpool_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carpool']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carpool_dev_data:
